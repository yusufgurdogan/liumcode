name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'   # refresh GPU prices every 6 hours
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow (share images)
        run: pip install pillow==11.3.0
      - name: Build site
        run: python3 build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      # Tell Bing/Yandex/Seznam (IndexNow) about changed pages. Only on push, not on the 6-hourly price refresh.
      - name: Ping IndexNow
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import glob, json, os, re, urllib.request
          key = next(os.path.basename(f)[:-4] for f in glob.glob("dist/*.txt") if re.fullmatch(r"[0-9a-f]{32}\.txt", os.path.basename(f)))
          urls = open("dist/urls.txt").read().split()
          body = json.dumps({"host": "liumcode.com", "key": key, "keyLocation": f"https://liumcode.com/{key}.txt", "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body, headers={"Content-Type": "application/json; charset=utf-8"})
          print(urllib.request.urlopen(req, timeout=30).status)
          PY
